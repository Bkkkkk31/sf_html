    <pre>
        "เร็วก็หาว่าล้ำหน้า
        พอช้าก็หาว่าอืดอาด
        โง่ก็ถูกตวาด
        พอฉลากก็ถูกระแวง
            ทำก่อนบอกไม่ได้สั่ง
        ครั้นพอทำทีหลังบอกไม่รู้จักคิก
        คนดี ดี ถูกถีบไปไกลตัว
        แต่กลับเอาคนชั่วมาใกล้ชิด"
    </pre>
